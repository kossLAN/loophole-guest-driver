[binaries]
c = 'i686-w64-mingw32-gcc'
cpp = 'i686-w64-mingw32-g++'
ar = 'i686-w64-mingw32-ar'
strip = 'i686-w64-mingw32-strip'
windres = 'i686-w64-mingw32-windres'
widl = 'i686-w64-mingw32-widl'
# Every dependency comes from a subproject, none from the build machine's pkg-config.
pkg-config = 'false'

[built-in options]
# No MinGW runtime DLLs to ship next to the driver.
c_link_args = ['-static', '-static-libgcc', '-static-libstdc++']
cpp_link_args = ['-static', '-static-libgcc', '-static-libstdc++']
prefer_static = true

[zlib:built-in options]
default_library = 'static'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'windows'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'
